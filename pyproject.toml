[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="da-platform"
version="0.1.0"
requires-python=">=3.11"
dependencies=["alembic>=1.13,<2","fastapi>=0.115,<1","pydantic-settings>=2.5,<3","psycopg[binary]>=3.2,<4","sqlalchemy>=2.0,<3","uvicorn[standard]>=0.30,<1"]
[project.optional-dependencies]
dev=["mypy>=1.11,<2","pytest>=8.3,<9","pytest-cov>=5,<6","ruff>=0.6,<1","httpx>=0.27,<1"]
[tool.hatch.build.targets.wheel]
packages=["backend"]
[tool.pytest.ini_options]
testpaths=["backend/tests"]
markers=["postgres: requires PostgreSQL"]
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E","F","I","UP","B","ANN"]
ignore=["E402","E501","E701","E702","E703","E741","F403","F405","I001"]
[tool.mypy]
python_version="3.11"
strict=true

[[tool.mypy.overrides]]
module=["backend.app.*"]
ignore_errors=true

[[tool.mypy.overrides]]
module=["backend.tests.*"]
ignore_errors=true
