services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: da, POSTGRES_PASSWORD: da, POSTGRES_DB: da}
    ports: ["55432:5432"]
  postgres-test:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: da, POSTGRES_PASSWORD: da, POSTGRES_DB: da_test}
    ports: ["55433:5432"]
