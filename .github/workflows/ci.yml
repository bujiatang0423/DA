name: ci
on: [push, pull_request]
jobs:
  verify:
    # This workflow is intended for a self-hosted runner with PostgreSQL
    # already listening on 127.0.0.1:5432. It deliberately does not require Docker.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q backend tools
      - run: python -m ruff check backend tools
      - run: python -m ruff format --check backend tools
      - run: python -m mypy backend
      - run: python -m tools.audit_release
      - run: >-
          python -m pytest backend/tests/security backend/tests/system/test_release_audit.py
          backend/tests/test_independent_paths.py -q
      - run: python -m tools.export_openapi
      - run: git diff --exit-code -- contracts/openapi.json
      - run: python -m pytest -m postgres
        env: {TEST_DATABASE_URL: postgresql+psycopg://da:da@127.0.0.1:5432/da_test}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
