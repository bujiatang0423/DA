name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: da, POSTGRES_PASSWORD: da, POSTGRES_DB: da_test}
        ports: ["55433:5432"]
        options: >-
          --health-cmd="pg_isready -U da -d da_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q backend tools
      - run: python -m ruff check backend tools
      - run: python -m ruff format --check backend tools
      - run: python -m mypy backend
      - run: python -m tools.export_openapi
      - run: git diff --exit-code -- contracts/openapi.json
      - run: python -m pytest -m postgres
        env: {TEST_DATABASE_URL: postgresql+psycopg://da:da@127.0.0.1:55433/da_test}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
